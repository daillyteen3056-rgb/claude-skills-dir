name: Weekly scrape + rebuild

on:
  schedule:
    - cron: '0 2 * * 0'   # Sunday 02:00 UTC
  workflow_dispatch:      # manual trigger button in Actions UI

permissions:
  contents: write         # needed to commit updated skills.json

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape skills from GitHub
        env:
          # GITHUB_TOKEN is auto-provided; use it to get 5000 req/hour instead of 60
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper/scrape.py

      - name: Build static site
        env:
          SITE_URL: https://skillnest.dev
          GOOGLE_VERIFY: ${{ vars.GOOGLE_VERIFY || '_tu33hAptmiDtcn1xUiAldSyNKXh0X5iY3rWDHwvHEc' }}
          BING_VERIFY: ${{ vars.BING_VERIFY || '' }}
          GUMROAD_URL: ${{ vars.GUMROAD_URL || 'https://daillyteen.gumroad.com/l/wapct' }}
        run: python site/build.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skills.json
          if git diff --cached --quiet; then
            echo "No changes to skills.json — nothing to commit."
            exit 0
          fi
          COUNT=$(python -c "import json; print(len(json.load(open('data/skills.json'))))")
          git commit -m "chore: weekly scrape — ${COUNT} skills"
          git push

      - name: Upload build artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
