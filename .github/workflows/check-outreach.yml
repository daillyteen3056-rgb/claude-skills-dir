name: Check outreach issues

on:
  schedule:
    - cron: '0 10 * * 1'   # Monday 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check issues and bump if quiet
        env:
          # Optional PAT with public_repo scope to post bump comments.
          # Add as repo secret TRACK_TOKEN. Without it, script runs dry-run.
          TRACK_TOKEN: ${{ secrets.TRACK_TOKEN }}
        run: python scripts/check-outreach.py

      - name: Commit state file if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outreach-state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore: update outreach state"
            git push
          fi
